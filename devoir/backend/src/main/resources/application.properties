spring.application.name=pacte
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/pacte}
spring.datasource.username=${DATABASE_USER:pacte}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.web.error.include-message=never
pacte.demo-enabled=${PACTE_DEMO_ENABLED:true}
pacte.timezone=Indian/Antananarivo
debug=false
logging.level.org.springframework=INFO

pacte.ai.api-key=${OPENAI_API_KEY:}
pacte.ai.model=${OPENAI_MODEL:gpt-4.1-mini}
pacte.ai.endpoint=https://api.openai.com/v1/responses
pacte.ai.timeout-seconds=60

pacte.ocr.command=${TESSERACT_COMMAND:tesseract}
pacte.ocr.languages=${OCR_LANGUAGES:fra+eng}

pacte.mail.enabled=${MAIL_ENABLED:false}
pacte.mail.from=${MAIL_FROM:}
pacte.mail.to=${MAIL_TO:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
